<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <title>Study Log - 学习日历</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/calendar.css">
</head>
<body data-page="calendar">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">Study Log</a>
      <nav class="main-nav">
        <a href="../index.html">首页</a>
        <a href="subject.html">学科</a>
        <a href="log.html">学习日志</a>
        <a href="plan.html">学习计划</a>
        <a href="statistics.html">数据统计</a>
        <a class="active" href="calendar.html">学习日历</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1 class="page-title">学习日历</h1>
      <p class="page-subtitle">按月查看每天的学习情况</p>

      <div class="calendar-toolbar">
        <button class="btn secondary" id="prev-month" type="button">上一月</button>
        <span class="calendar-title" id="calendar-title"></span>
        <button class="btn secondary" id="next-month" type="button">下一月</button>
        <button class="btn secondary" id="today-month" type="button">今天</button>
      </div>
      <p class="muted" id="calendar-summary"></p>
      <div class="calendar-weekdays" id="calendar-weekdays"></div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Study Log · <span id="footer-year"></span></div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/subjects.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/calendar.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
