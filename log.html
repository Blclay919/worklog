<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <title>Study Log - 学习日志</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/log.css">
</head>
<body data-page="log">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">Study Log</a>
      <nav class="main-nav">
        <a href="../index.html">首页</a>
        <a href="subject.html">学科</a>
        <a class="active" href="log.html">学习日志</a>
        <a href="plan.html">学习计划</a>
        <a href="statistics.html">数据统计</a>
        <a href="calendar.html">学习日历</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1 class="page-title">学习日志</h1>
      <p class="page-subtitle">按日期查看每天的学习记录</p>

      <div class="log-toolbar">
        <button class="btn secondary" id="prev-day" type="button">前一天</button>
        <input class="input log-date-input" id="log-date-input" type="date">
        <button class="btn secondary" id="next-day" type="button">后一天</button>
      </div>
      <p class="muted" id="log-date-label"></p>
      <p class="log-summary" id="log-summary"></p>

      <section class="card">
        <h2>当日记录</h2>
        <div id="log-list"></div>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop"></div>
    <img id="lightbox-image" alt="图片大图">
  </div>

  <footer class="site-footer">
    <div class="container">Study Log · <span id="footer-year"></span></div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/subjects.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/log.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
